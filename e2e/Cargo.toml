[package]
authors = ["joshua@geschwendt.com"]
edition = "2024"
license = "UNLICENSED"
name = "e2e"
publish = false
version = "0.1.0"

# Flat on purpose — one file per binary beside the manifest, not a src/ tree.
[[bin]]
name = "e2e"
path = "main.rs"

# Site tooling, not a test — it lives here because it is jlg.io-specific, and
# crates/harness stays fully generic for its eventual extraction.
[[bin]]
name = "resume-pdf"
path = "resume-pdf.rs"

[dependencies]
# The driver machinery — agent-browser socket client, CSP bypass, server
# ownership — lives with the other Rust in crates/; this crate is the suite.
harness = { path = "../crates/harness" }
serde_json = "1.0.151"
