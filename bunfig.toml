# Env-guarded harness preloads. bun ignores `NODE_OPTIONS=--require`, and its
# `preload` is inherited by every child process started from this directory —
# the only hook that reaches the workers a `next build` spawns.
#
# `coverage-exit.cjs` (armed by COVERAGE=1) flushes build-time Istanbul
# counters; `harness-server-debug.cjs` (armed by HARNESS_SERVER_DEBUG=1)
# surfaces errors the e2e server would swallow. Both are inert unarmed, so
# `bun run dev`, `bun run build` and plain `bun x` pay two cheap requires.
preload = ["./scripts/coverage-exit.cjs", "./scripts/harness-server-debug.cjs"]
