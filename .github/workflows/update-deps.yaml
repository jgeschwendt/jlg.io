name: update-deps

# Daily dependency refresh: `bun update --latest` off main, shipped as an
# auto-merge PR. The required checks are the merge gate — this workflow never
# builds or tests. Red runs are repaired on the update-deps branch by the
# local `github-failures` routine, which watches every repo's checks. First of
# a family — copy per repo, or lift into a reusable workflow at the second
# adopter.
#
# The bump is deterministic shell; claude-code-action ships it (commit, push,
# PR, auto-merge) on the Claude GitHub App's credentials. That identity is the
# point, not a convenience: events created by GITHUB_TOKEN trigger no
# workflows, so a GITHUB_TOKEN-opened PR would sit with its required checks
# forever unstarted, and a GITHUB_TOKEN-armed auto-merge would land on main
# without triggering the production deploy. A real app's token has neither
# problem. Needs the Claude GitHub App (github.com/apps/claude) installed on
# the repo and the CLAUDE_CODE_OAUTH_TOKEN secret (`claude setup-token`).

# The schedule is best-effort: GitHub can fire it hours after the cron under
# load (runs 33257848644 and 33316867543 started ~5h past 09:17 UTC). Good
# enough for a daily refresh; for an immediate bump:
# `gh workflow run update-deps.yaml`.
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

concurrency:
  cancel-in-progress: false
  group: update-deps

permissions:
  actions: read
  contents: write
  id-token: write
  packages: read
  pull-requests: write

jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # One open update-deps PR at a time — yesterday's red PR is being
      # repaired, not superseded.
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(gh pr list -R "$GITHUB_REPOSITORY" --head update-deps --state open --json number --jq '.[].number')" ]; then
            echo "open update-deps PR still pending — not stacking a second"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - if: steps.guard.outputs.skip != 'true'
        uses: jdx/mise-action@v2

      - if: steps.guard.outputs.skip != 'true'
        id: bump
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun update --latest

          # holds: deliberate pin-backs that `bun update --latest` would
          # re-bump — restored after every update. Drop an entry when upstream
          # catches up (the dated reason says what to check); add one whenever
          # a red run ends in a pin-back on the branch.
          # - swc-plugin-coverage-instrument 0.0.32: 0.0.33 targets swc_core
          #   30.0.0 but next 16.3.3's plugin runner is 30.0.1 — instrumented
          #   builds die ("failed to deserialize swc_ecma_ast"). Recheck on any
          #   next or plugin release. (2026-08-27, PR #573)
          holds="swc-plugin-coverage-instrument@0.0.32"

          for hold in $holds; do
            pkg="${hold%@*}"
            if jq -e --arg p "$pkg" '.dependencies[$p]' package.json >/dev/null; then
              bun add --exact "$hold"
            else
              bun add --exact -d "$hold"
            fi
          done

          if git diff --quiet; then
            echo "already at latest — nothing to ship"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Runs only when the bump changed something — quiet days spend nothing.
      - if: steps.bump.outputs.changed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_args: --model sonnet --allowedTools "Bash(git:*),Bash(gh:*)"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            The working tree carries today's dependency bump (`bun update
            --latest` with holds restored) — already run. Change no files;
            your job is only to ship what is here:

            1. `git checkout -b update-deps`
            2. `git commit --no-verify -am "task(//): deps — daily bun update --latest"`
               (--no-verify: hooks are not installed in this runner; the PR's
               required checks cover everything they would)
            3. `git push -f origin update-deps`
            4. `gh pr create --head update-deps --title "task(//): deps — daily bun update --latest"`
               with a short body: the notable version bumps read from the
               package.json diff, plus the line "Auto-merges on green; a red
               run is repaired on this branch by the `github-failures`
               routine."
            5. `gh pr merge update-deps --auto --squash`
