name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Never cancel an in-flight production deploy; PR runs supersede freely.
concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: ci-${{ github.event.pull_request.number || github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bunx oxfmt -c oxfmt.config.ts --check
      - run: bun run lint
      # Type safety: Next 16.2's in-build type check cannot drive TypeScript 7's
      # native API and is skipped (see next.config.js), so enforce types here.
      - run: bunx tsc --noEmit

  # `vercel build` runs the full Next build, so a separate `bun run build` in
  # check would build everything twice per run. That build no longer type-checks
  # under TS7 (see next.config.js) — the `bunx tsc --noEmit` step above is the
  # type gate.
  deploy:
    needs: check
    secrets: inherit
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
