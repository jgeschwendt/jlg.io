name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Never cancel an in-flight production deploy; PR runs supersede freely.
concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: ci-${{ github.event.pull_request.number || github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # stele freshness walks git blame over the anchored code — needs full history.
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bunx oxfmt --check
      - run: bun run lint
      - run: bunx tsc --noEmit

      # stele: assert the agent-doc graph is fresh (anchors resolve, claims not
      # staled by drift) and the committed AGENTS.md / index files match the lock.
      # Pinned to the binary the lock was built with; CI never runs `stele build`
      # (that would launder staleness). liveness resolves the nodes' `bun`/`bunx`
      # commands against the PATH mise-action set up above.
      - run: curl -fsSL https://raw.githubusercontent.com/jgeschwendt/stele/main/scripts/install.sh | bash -s v0.2.0
      - run: ~/.local/bin/stele check
      - run: ~/.local/bin/stele emit --check

  # The Rust coverage harness (crates/harness): an instrumented dev server
  # driven through agent-browser's daemon, gated by the same ≥90 thresholds as
  # the Playwright flow in coverage.yml. Dev mode on purpose — prod coverage
  # stays coverage.yml's job; this asserts the harness itself keeps working.
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # mise.toml pins rust alongside bun and node, so this one action also
      # provides the cargo toolchain the harness builds with.
      - uses: jdx/mise-action@v2

      - name: Cache bun install cache
        uses: actions/cache@v6
        with:
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          path: ~/.bun/install/cache
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          key: cargo-${{ runner.os }}-${{ hashFiles('crates/harness/Cargo.lock') }}
          path: |
            ~/.cargo/registry
            crates/harness/target
          restore-keys: cargo-${{ runner.os }}-

      # Pinned: the harness speaks the daemon's socket protocol directly, so a
      # silent CLI upgrade is a protocol change. Bump deliberately, with a local
      # `bun run coverage:harness` against the new version first.
      - run: npm install -g agent-browser@0.34.0

      # Keyed on the CLI version, which decides the Chromium build it fetches.
      - name: Cache agent-browser Chromium
        uses: actions/cache@v6
        with:
          key: agent-browser-${{ runner.os }}-0.34.0
          path: ~/.agent-browser/browsers

      # `--with-deps` every time even on a cache hit: system libraries live
      # outside the cached browser directory (same shape as coverage.yml's
      # Playwright install).
      - run: agent-browser install --with-deps

      # The runner's rustup provisions the mise-pinned toolchain with the
      # minimal profile, which ships neither component.
      # (observed 2026-08-18 · run 32158578774: "'cargo-fmt' is not installed")
      - run: rustup component add clippy rustfmt

      - run: cargo fmt --check --manifest-path crates/harness/Cargo.toml
      - run: cargo clippy --all-targets --manifest-path crates/harness/Cargo.toml -- -D warnings

      # Self-failing: the runner panics on any behavioral assertion, and
      # `scripts/coverage-report.ts` exits non-zero below the thresholds.
      - run: bun run coverage:harness

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          if-no-files-found: ignore
          name: harness-coverage
          path: |
            .nyc_output/
            coverage/
          retention-days: 7

  deploy:
    needs: check
    secrets: inherit
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
