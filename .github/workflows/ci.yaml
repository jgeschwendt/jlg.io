name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Never cancel an in-flight production deploy; PR runs supersede freely.
concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: ci-${{ github.event.pull_request.number || github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # stele freshness walks git blame over the anchored code — needs full history.
          fetch-depth: 0
      - uses: jdx/mise-action@v2

      - run: bun install --frozen-lockfile
      - run: bun run fmt --check
      - run: bun run lint
      - run: bunx --bun tsc --noEmit

      # stele: assert the agent-doc graph is fresh (anchors resolve, claims not
      # staled by drift) and the committed AGENTS.md / index files match the lock.
      # Pinned to the binary the lock was built with; CI never runs `stele build`
      # (that would launder staleness). liveness resolves the nodes' `bun`/`bunx`
      # commands against the PATH mise-action set up above.
      - run: curl -fsSL https://raw.githubusercontent.com/jgeschwendt/stele/main/scripts/install.sh | bash -s v0.3.0
      - run: ~/.local/bin/stele check
      - run: ~/.local/bin/stele emit --check

  # The e2e suite (e2e/, driven by crates/harness) against the production
  # build: instrumented `next build`, every route asserted over `next start`,
  # the 100% coverage gate. Prod on purpose — it is the artifact that deploys,
  # it includes the build workers' counters, and it exercises the CSP bypass
  # where it is load-bearing (dev grants 'unsafe-eval'). coverage.yml runs the
  # same chain on main to publish the report to Pages.
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # mise.toml pins rust alongside bun, so this one action also
      # provides the cargo toolchain the harness builds with.
      - uses: jdx/mise-action@v2

      # No bun cache: `bun install` from the registry takes ~2s, while the
      # ~/.bun/install/cache it replaced had grown to 2GB (every restore carried
      # old versions forward), cost ~55s a job to restore and save, and crowded
      # the repo's 10GB cache quota until the cargo cache entries were evicted.
      - run: bun install --frozen-lockfile

      # mbx (mise.toml's `cargo` wrapper) caches each rustc invocation on its
      # inputs and compiler. `objects` mode carries that store, not a target
      # tree, so one entry serves both workspaces' target dirs; it omits the
      # registry, which cargo re-downloads. Saved after a green push to main,
      # keyed per commit; PRs and `preview` restore the latest main entry and
      # never save, and coverage.yaml is read-only — this job compiles the
      # superset (clippy and the e2e build), so it alone writes.
      - uses: jdx/mr-boxington-action@v1
        with:
          github-cache-mode: objects

      # Turbopack writes its build cache to .next/cache (on by default since
      # Next 16.3); restoring it takes the instrumented compile from ~35s to
      # near zero. Scoped to one bun.lock so the cache restarts whenever the
      # dependencies move rather than accreting across them.
      - name: Cache Next build (coverage)
        uses: actions/cache@v6
        with:
          key: next-coverage-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('bunfig.toml', 'next.config.js', 'postcss.config.js', 'src/**', 'tsconfig.json') }}
          path: .next/cache
          restore-keys: next-coverage-${{ runner.os }}-${{ hashFiles('bun.lock') }}-

      - uses: ./.github/actions/agent-browser

      # The runner's rustup provisions the mise-pinned toolchain with the
      # minimal profile, which ships neither component.
      # (observed 2026-08-18 · run 32158578774: "'cargo-fmt' is not installed")
      - run: rustup component add clippy rustfmt

      - run: cargo fmt --check --manifest-path crates/harness/Cargo.toml
      - run: cargo fmt --check --manifest-path e2e/Cargo.toml
      - run: cargo clippy --all-targets --manifest-path crates/harness/Cargo.toml -- -D warnings
      - run: cargo clippy --all-targets --manifest-path e2e/Cargo.toml -- -D warnings

      # Self-failing: the runner panics on any behavioral assertion, and
      # `scripts/coverage-report.ts` exits non-zero below the thresholds.
      - run: bun run coverage

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          if-no-files-found: ignore
          name: harness-coverage
          path: |
            .nyc_output/
            coverage/
          retention-days: 7

  deploy:
    needs: check
    secrets: inherit
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}

  # The same suite (e2e/) run against the preview deployment this PR just
  # produced. Nothing is built or served here: the browser drives the URL
  # `deploy` returned, so every assertion lands on the real Vercel edge — the
  # per-request CSP as actually served, on the artifact that will serve
  # traffic. No coverage on this path; a deployment is a plain production build
  # carrying no counters, and `harness` above owns that half.
  #
  # `pull_request` only: on main the same run would point at production, which
  # nobody asked for.
  #
  # No rustup/fmt/clippy either — `harness` runs them once per PR.
  preview:
    needs: deploy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Restore only — `harness` owns every save (see there).
    cache-mode: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # mise.toml pins rust alongside bun, so this one action also
      # provides the cargo toolchain the harness builds with.
      - uses: jdx/mise-action@v2

      - uses: jdx/mr-boxington-action@v1
        with:
          github-cache-mode: objects

      - uses: ./.github/actions/agent-browser

      # Self-failing: the runner panics on any behavioral assertion. No
      # `bun install` above it — remote mode compiles the e2e crate and drives
      # agent-browser, and touches nothing in node_modules.
      - run: bun run e2e:remote "${{ needs.deploy.outputs.url }}"

      # `.nyc_output/` is where `goto` files a failed navigation's autopsy;
      # there is no coverage/ on this path.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          if-no-files-found: ignore
          name: preview
          path: .nyc_output/
          retention-days: 7
