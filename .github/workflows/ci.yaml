name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Never cancel an in-flight production deploy; PR runs supersede freely.
concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: ci-${{ github.event.pull_request.number || github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
        env:
          # NODE_AUTH_TOKEN secret: PAT with read:packages — the workflow
          # GITHUB_TOKEN cannot read packages linked to jgeschwendt/jlg.
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
      - run: bunx oxfmt --check
      - run: bun run lint

  # `vercel build` runs the full Next build (with type checking), so a separate
  # `bun run build` in check would build everything twice per run.
  deploy:
    needs: check
    secrets: inherit
    uses: ./.github/workflows/deploy.yaml
    with:
      environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
