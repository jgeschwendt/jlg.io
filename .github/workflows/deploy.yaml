name: deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    outputs:
      url:
        description: The URL of the deployment this run produced.
        value: ${{ jobs.deploy.outputs.url }}

jobs:
  deploy:
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - run: bun install --frozen-lockfile

      - name: Link Vercel project
        run: bunx --bun vercel link --project=${{ vars.VERCEL_PROJECT_ID }} --scope=${{ vars.VERCEL_ORG_ID }} --token=${{ secrets.VERCEL_TOKEN }} --yes

      - name: Pull Vercel environment
        run: bunx --bun vercel pull --yes --environment=${{ inputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}

      # The wasm background only changes when its crate or build script does, so
      # cache the built output itself, keyed on exactly those inputs: a hit skips
      # the toolchain, cargo and wasm-bindgen steps below entirely.
      - name: Cache background wasm output
        id: wasm-output
        uses: actions/cache@v6
        with:
          key: wasm-output-${{ runner.os }}-${{ hashFiles('crates/background/Cargo.lock', 'crates/background/Cargo.toml', 'crates/background/src/**', 'scripts/background-wasm.ts') }}
          path: public/background

      # mise-action's rust pin is a versioned toolchain, but
      # `scripts/background-wasm.ts` builds with RUSTUP_TOOLCHAIN=stable, and the
      # runner's rustup ships neither that toolchain nor the wasm32 target.
      # (same shape as ci.yaml's `rustup component add`)
      - if: steps.wasm-output.outputs.cache-hit != 'true'
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      # On a source change the Bevy release profile (lto, codegen-units = 1,
      # opt-level = "z") is minutes cold and seconds warm. rust-cache keys on the
      # rustc that will build (hence RUSTUP_TOOLCHAIN) and re-saves when that key
      # moves; the hand-rolled actions/cache it replaces keyed on Cargo.lock
      # alone, so an exact hit never re-saved and a stale target dir was restored
      # into a full 218-crate rebuild on every deploy.
      - name: Cache cargo (background wasm)
        if: steps.wasm-output.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          key: wasm32
          workspaces: crates/background -> target

      # The script probes `wasm-bindgen --version` and falls back to
      # `cargo install wasm-bindgen-cli` — a multi-minute compile — whenever the
      # binary is missing or off the Cargo.lock version. Dropping the matching
      # prebuilt binary into ~/.local/bin (already on GITHUB_PATH from the node
      # shim above) makes that fallback dead in CI; reading the version out of
      # the lock keeps the same lockstep rule the script enforces.
      - name: Install wasm-bindgen CLI
        if: steps.wasm-output.outputs.cache-hit != 'true'
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' crates/background/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          [ -n "$version" ] || { echo 'wasm-bindgen missing from crates/background/Cargo.lock' >&2; exit 1; }
          dir="wasm-bindgen-${version}-x86_64-unknown-linux-musl"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/${dir}.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.local/bin" "${dir}/wasm-bindgen"

      # Writes public/background/{background.js,background_bg.wasm}, which
      # `next build` (inside `vercel build`) copies into the output. This is the
      # only workflow that needs it — the e2e harness never asserts the
      # background, and Background.tsx tolerates the module's absence.
      - if: steps.wasm-output.outputs.cache-hit != 'true'
        run: bun run background:build

      - name: Build
        run: bunx --bun vercel build ${{ inputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      # "When deploying, `stdout` is always the Deployment URL" — the CLI puts
      # progress and errors on stderr, so the command substitution below needs
      # no parsing (https://vercel.com/docs/cli/deploy, fetched 2026-09-09).
      # ci.yaml's `preview` job runs the e2e suite against this URL, so a
      # deployment that never yields one must fail the job rather than hand a
      # later step an empty string.
      - id: deploy
        name: Deploy
        run: |
          url=$(bunx --bun vercel deploy --prebuilt ${{ inputs.environment == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          [ -n "$url" ] || { echo 'vercel deploy printed no deployment URL' >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployed $url" >> "$GITHUB_STEP_SUMMARY"
