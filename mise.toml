[tools]
# Two runtimes, each pinned here for dev and CI alike. Repo-owned invocations
# run on bun, forced explicitly (`bun --bun` / `bunx --bun`); third-party
# node-shebang bins (agent-browser, vercel and its builders, the oxlint/oxfmt
# launchers and the TS configs they evaluate) run on node. bun 1.3.14's
# exit-path segfault once forced node into the instrumented build (runs
# 31955271334, 31956326050); the 1.4.0 pin cleared it — hold the pin at >=1.4.0.
# ※ config-runtime
bun = "1.4.0"
node = "24.21.0"
# The rustup channel, not "latest": mise resolves "latest" against the network
# on every install (~8s a CI job · run 37029925800 "rust@latest resolving"),
# while "stable" is the toolchain the runner image already carries — the same
# one deploy.yaml's wasm build uses.
rust = "stable"

[env]
_.file = ".env"

[tasks.dev]
description = "Boot the dev server through visor (http://localhost:3000)"
run = "visor -- bun --bun next dev"

[tasks."dev:raw"]
description = "Dev server without visor (bisect path)"
run = "bun --bun next dev"
