[tools]
# ※ config-runtime
bun = "1.4.4"
hk = { version = "2.10.0", workflow = "release.yml" }
mr-boxington = { version = "1.29.0", workflow = "release.yml@refs/heads/main" }
rust = { version = "stable", mr_boxington = true }

[env]
_.file = ".env"

[tasks.dev]
description = "Boot the dev server through visor (http://localhost:3000)"
run = "visor -- bun --bun next dev"

