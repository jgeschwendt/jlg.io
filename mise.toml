[tools]
# ※ config-runtime
bun = "1.4.4"
hk = { version = "2.10.0", workflow = "release.yml" }
mr-boxington = { version = "1.29.0", workflow = "release.yml@refs/heads/main" }
rust = { version = "stable", mr_boxington = true }

[env]
_.file = ".env"

[tasks.check]
description = "The whole gate, ci.yaml's check and harness jobs: every check:* task at once"
depends = ["check:*"]

[tasks."check:coverage"]
description = "Instrumented build, the e2e suite over next start, the 100 % coverage thresholds"
run = "bun run coverage"

[tasks."check:fmt"]
description = "Format check (bun fmt)"
run = "bun fmt --check"

[tasks."check:lint"]
description = "Lint with oxlint"
run = "bun lint"

[tasks."check:rust"]
description = "rustfmt and clippy over the harness and e2e crates"
run = [
  "cargo fmt --check --manifest-path crates/harness/Cargo.toml",
  "cargo fmt --check --manifest-path e2e/Cargo.toml",
  "cargo clippy --all-targets --manifest-path crates/harness/Cargo.toml -- -D warnings",
  "cargo clippy --all-targets --manifest-path e2e/Cargo.toml -- -D warnings",
]

[tasks."check:stele"]
description = "The agent-doc graph is fresh and the emitted files match the lock"
run = "stele check && stele emit --check"

[tasks."check:types"]
description = "Typecheck (bun check)"
run = "bun check"

[tasks.dev]
description = "Boot the dev server through visor (http://localhost:3000)"
run = "visor -- bun --bun next dev"

